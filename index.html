<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&display=swap"
    rel="stylesheet">


  <title>Frontend Mentor | Product preview card component</title>

  <link rel="stylesheet" href="app.css">

</head>

<body>
  <main class="content_wrapper">
    <div class="img_wrapper">
      <img src="images/image-product-mobile.jpg" alt="product image" class="product_mobile">
    </div>

    <h2 class="category">Perfume</h2>

    <h1 class="title">Gabrielle Essence Eau De Parfum</h1>

    <p class="description">A floral, solar and voluptuous interpretation composed by Olivier Polge,
      Perfumer-Creator for the House of CHANEL.</p>

    <span><data value="149.99" class="final_price">$149.99</data> <data value="169.99"
        class="starting_price">$169.99</data></span>

    <button> <img src="images/icon-cart.svg" alt="icon cart" class="cart_icon"> Add to Cart</button>

  </main>

  <!-- <footer class="attribution">

    Coded by <a href="#">Your Name Here</a>.
  </footer> -->
</body>

</html>
