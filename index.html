<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <title>Frontend Mentor | Product preview card component</title>

  <link rel="stylesheet" href="app.css">

</head>

<body>
  <main class="content_wrapper">
    <img src="images/image-product-mobile.jpg" alt="product image">

    <h2>Perfume</h2>

    <h1>Gabrielle Essence Eau De Parfum</h1>

    <p class="description">A floral, solar and voluptuous interpretation composed by Olivier Polge,
      Perfumer-Creator for the House of CHANEL.</p>

    <data value="149.99" class="final_price">$149.99</data>
    <data value="169.99" class="starting_price">$169.99</data>

    <button> <img src="images/icon-cart.svg" alt="icon cart"> Add to Cart</button>

  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Your Name Here</a>.
  </footer>
</body>

</html>
